# Turn a v* tag into a GitHub release carrying a self-contained ndmicroasm for each platform.
#
#   test     The same test run build.yml does, repeated here so a tag can never publish a build
#            that was not tested.
#
#   publish  One single-file, self-contained ndmicroasm per runtime - win-x64, linux-x64, osx-x64
#            and osx-arm64 - each built on its own operating system's runner. The publish switches
#            are the ones build.ps1 uses; read the comment there before changing any of them.
#
#   release  Runs once, after every publish job succeeded, and attaches the four files to the
#            release for the tag. One failed platform means no release at all.
#
# Make a release:   git tag v0.1.0 && git push origin v0.1.0
# The tag is the release name AND the version: the publish job passes -p:Version=<tag without the
# leading v>, so the exe's file version and assembly version come from the tag. VersionPrefix in
# Directory.Build.props is only the version of local builds.
#
# macOS and Linux get a .tar.gz because a bare binary loses its execute bit when it is downloaded.
name: release
on:
  push:
    tags: [ 'v*' ]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - run: dotnet restore
        working-directory: src
      - run: dotnet build -c Release --no-restore -warnaserror -nodeReuse:false
        working-directory: src
      - run: dotnet test -c Release --no-build -nodeReuse:false
        working-directory: src

  publish:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset is the one file each runner hands to the release job.
          - os: windows-latest
            rid: win-x64
            binary: ndmicroasm.exe
            asset: ndmicroasm-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: ndmicroasm
            asset: ndmicroasm-linux-x64.tar.gz
          # macos-13 was retired; macos-15-intel is the Intel image that is still live.
          - os: macos-15-intel
            rid: osx-x64
            binary: ndmicroasm
            asset: ndmicroasm-osx-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            binary: ndmicroasm
            asset: ndmicroasm-osx-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/global.json
      - name: Publish
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish src/NDMicroAsm/NDMicroAsm.csproj -c Release -r ${{ matrix.rid }} --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:SatelliteResourceLanguages=en -p:DebugType=none -p:GenerateDocumentationFile=false `
            -p:EnableCompressionInSingleFile=true -p:Version=$version -o out -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
      - name: Package
        shell: pwsh
        run: |
          if ('${{ matrix.asset }}'.EndsWith('.tar.gz')) {
            tar -czf '${{ matrix.asset }}' -C out '${{ matrix.binary }}'
          } else {
            Copy-Item 'out/${{ matrix.binary }}' '${{ matrix.asset }}'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
